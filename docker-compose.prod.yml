version: '3.8'

# Production overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  db:
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Remove init scripts volume mount in production
    # The ./backend/scripts:/docker-entrypoint-initdb.d mount from base config is not needed
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  api:
    environment:
      - API_RELOAD=false
      - LOG_LEVEL=WARNING
      - SERVICE_ROLE=api
      - UVICORN_RELOAD=false
    volumes:
      # Remove source code mount in production
      - ./exports:/app/exports
      - ./logs:/app/logs

  worker:
    environment:
      - LOG_LEVEL=WARNING
      - TASK_MAX_WORKERS=8
      - SERVICE_ROLE=worker
    volumes:
      # Remove source code mount in production
      - ./exports:/app/exports
      - ./logs:/app/logs

  beat:
    environment:
      - LOG_LEVEL=WARNING
      - SERVICE_ROLE=beat
    volumes:
      - ./logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    # 生產環境使用 nginx，不需要 volumes 和開發命令
    volumes: []
    # 明確使用 nginx 啟動命令
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      - api


