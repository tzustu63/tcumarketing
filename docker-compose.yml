services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: recruitment-db
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-recruitment}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - recruitment-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: recruitment-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - recruitment-network

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruitment-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-recruitment}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_MAX_REQUESTS_PER_DOMAIN=${RATE_LIMIT_MAX_REQUESTS_PER_DOMAIN:-10}
      - RATE_LIMIT_DOMAIN_TIME_WINDOW=${RATE_LIMIT_DOMAIN_TIME_WINDOW:-60}
      - RATE_LIMIT_MIN_REQUEST_INTERVAL=${RATE_LIMIT_MIN_REQUEST_INTERVAL:-2.0}
      - SCRAPING_HEADLESS=${SCRAPING_HEADLESS:-true}
      - SCRAPING_MIN_DELAY=${SCRAPING_MIN_DELAY:-2}
      - SCRAPING_MAX_DELAY=${SCRAPING_MAX_DELAY:-5}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      - SERVICE_ROLE=api
      - UVICORN_RELOAD=${UVICORN_RELOAD:-true}
    volumes:
      - ./backend:/app
      - ./exports:/app/exports
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - recruitment-network

  # Celery Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruitment-worker
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-recruitment}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TASK_MAX_WORKERS=${TASK_MAX_WORKERS:-4}
      - TASK_TIMEOUT=${TASK_TIMEOUT:-300}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - SCRAPING_HEADLESS=${SCRAPING_HEADLESS:-true}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      - SERVICE_ROLE=worker
    volumes:
      - ./backend:/app
      - ./exports:/app/exports
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - recruitment-network

  # Celery Beat (Optional - for scheduled tasks)
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruitment-beat
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-recruitment}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SERVICE_ROLE=beat
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - recruitment-network

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    container_name: recruitment-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - recruitment-network

volumes:
  postgres_data:
  redis_data:

networks:
  recruitment-network:
    driver: bridge
