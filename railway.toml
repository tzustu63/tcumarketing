# Railway.toml - Railway 部署配置

# 此配置文件用於指導 Railway 如何部署專案
# 由於此專案包含多個服務，需要在 Railway 中分別部署

# API 服務配置（對應服務名稱：tcu-api）
[tcu-api]
rootDirectory = "backend"
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**"]

[tcu-api.deploy]
startCommand = "/app/start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 100

# Worker 服務配置（對應服務名稱：tcu-worker）
[tcu-worker]
rootDirectory = "backend"
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**"]

[tcu-worker.deploy]
startCommand = "/app/start.sh"

# Beat 服務配置（對應服務名稱：tcu-beat）
[tcu-beat]
rootDirectory = "backend"
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**"]

[tcu-beat.deploy]
startCommand = "/app/start.sh"

# Frontend 服務配置（對應服務名稱：tcu-frontend）
[tcu-frontend]
rootDirectory = "frontend"
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["frontend/**"]

[tcu-frontend.deploy]
startCommand = "/start.sh"

